[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simharness"
version = "0.1.0"
description = "Scenario-driven regression testing for robot behaviour in simulation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pratyush Vatsa"}]
keywords = ["robotics", "simulation", "testing", "gazebo", "airsim", "isaac-sim", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
simharness = "simharness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
# ROS 2 Humble ships launch_testing / launch_testing_ros pytest plugins whose
# hook signatures predate pytest 8. With a Humble workspace sourced, plain
# `pytest` dies during plugin registration before collecting anything, and the
# error mentions pytest_pycollect_makemodule rather than anything in this repo.
# These tests need neither plugin, and blocking a plugin that is not installed
# is a no-op, so this line is safe on a machine with no ROS at all.
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
line-length = 118
target-version = "py39"
