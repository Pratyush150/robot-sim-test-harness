extends: _base_air.yaml
name: approach_damping
description: >
  A single 15 m step input, flown with no obstacles and no wind, purely to
  measure the shape of the approach: overshoot past the goal, settling time
  into a 0.4 m band, jerk, and whether the vehicle hunts around the setpoint
  once it arrives. These are the numbers that change first when someone
  retunes a gain, which makes this the most sensitive regression scenario in
  the suite.
tags: [air, tuning, response]

goal: {x: 15.0, y: 0.0, z: 5.0, tolerance: 0.4, within: 20.0}

controller:
  kp_linear: 1.2
  kd_linear: 0.08

sim: {time_limit: 30.0, seed: 20260606, stop_on_goal: false}

sensors:
  position_noise_std: 0.01
  yaw_noise_std: 0.005
  velocity_noise_std: 0.01

assertions:
  - {type: reached_goal, name: arrives_on_time}
  - {type: overshoot, name: overshoot_bounded, signal: distance_to_goal,
     target: 0.0, max_percent: 5.0}
  - {type: settling_time, name: settles_quickly, signal: distance_to_goal,
     target: 0.0, band: 0.4, limit: 14.0}
  - {type: max_jerk, name: jerk_limit, limit: 90.0, after: 0.2}
  - {type: no_oscillation, name: no_hunting, signal: x, max_frequency: 0.5,
     min_amplitude: 0.1, after: 8.0}
  - {type: max_velocity, name: speed_limit, limit: 4.1}
  - {type: eventually_always, name: stays_parked, settle_by: 16.0,
     predicate: {signal: distance_to_goal, op: "<=", value: 0.4}}
  - {type: energy_budget, name: energy, max_wh: 1.6}
